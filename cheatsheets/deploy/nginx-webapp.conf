# Раздача мини-приложений со своего сервера — нужна, только если не
# используешь GitHub Pages. Замени ДОМЕН и путь, затем выпусти сертификат:
#   sudo certbot --nginx -d ДОМЕН
# Telegram открывает Web App только по HTTPS с валидным сертификатом,
# на голый IP это не работает.

server {
    listen 80;
    listen [::]:80;
    server_name ДОМЕН;

    # certbot заменит это на редирект в HTTPS
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ДОМЕН;

    # Каталог, куда install.sh положил мини-приложения
    root /opt/postneo/webapp;
    index index.html;

    # ssl_certificate и ssl_certificate_key пропишет certbot

    # Мини-приложения открываются во фрейме Telegram
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Страницы часто правятся — не кэшируем, чтобы правки долетали сразу
    location ~* \.(html|json|js)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # PDF-шпаргалки, если хочешь отдавать их ссылкой, а не файлом
    location /cheatsheets/pdf/ {
        alias /opt/postneo/cheatsheets/pdf/;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location / { try_files $uri $uri/ =404; }
}
